name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=mdv-${GITHUB_REF_NAME}-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/mdv
          [[ "${{ matrix.target }}" == *windows* ]] && bin="$bin.exe"
          mkdir -p "$name/completions"
          cp README.md LICENSE "$name"/
          # Builds are native, so the binary can generate its own docs.
          "$bin" --man > "$name/mdv.1"
          "$bin" --completions bash > "$name/completions/mdv.bash"
          "$bin" --completions zsh > "$name/completions/_mdv"
          "$bin" --completions fish > "$name/completions/mdv.fish"
          "$bin" --completions powershell > "$name/completions/_mdv.ps1"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/mdv.exe "$name"/
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/mdv "$name"/
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
