[package]
name = "mdv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast terminal viewer for Markdown, Org, AsciiDoc and reStructuredText"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "viewer", "terminal", "tui", "pager"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["tests/snapshots", ".github"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
dirs = "7.0.0"
emojis = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
terminal-light = "1.9.1"
toml = "1.1.6"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"

[[bench]]
name = "render"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
